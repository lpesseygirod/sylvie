# Sylvie configuration. Everything swappable lives here (plan section 5).
# Values marked "default — Lea can change" are decisions Lea hasn't made yet.

user:
  name: Lea
  city: Madrid
  timezone: Europe/Madrid
  currency: EUR
  languages: [en, es, fr]

paths:
  # All personal data lives outside Documents so it never syncs to iCloud (rule 15).
  data_dir: ~/Library/Application Support/Sylvie
  adapters_dir: ~/Library/Application Support/Sylvie/adapters

llm:
  model: mlx-community/Qwen3.8-27B-4bit
  adapter: null              # e.g. v001 once a fine-tune is promoted
  context_length: 16384      # set explicitly; long chats get summarized
  summarize_after_tokens: 11000
  max_tokens_fast: 1024
  max_tokens_thinking: 4096
  temperature: 0.7
  top_p: 0.8
  thinking_temperature: 0.6
  thinking_top_p: 0.95

embeddings:
  model: mlx-community/Qwen3-Embedding-0.6B-8bit   # default — Lea can change
  dim: 1024

server:
  host: 127.0.0.1           # never 0.0.0.0 (rule 2)
  port: 8765
  allowed_origins: ["http://127.0.0.1:8765"]

search:
  enabled: true
  searxng_url: http://127.0.0.1:8888
  max_results: 5
  max_pages_to_open: 3

memory:
  recall_top_k: 6
  extract_in_background: true
  # Learn from Lea's own messages to Claude: Claude Code (~/.claude/projects) and claude.ai exports, read locally.
  # Only what she typed — never Claude's answers. Rules about answers arrive switched off for her to approve.
  claude_history:
    enabled: true
    folder: ~/.claude/projects
    exclude_projects: []           # folder names under ~/.claude/projects to skip
    exports_folder: ~/Documents/Sylvie/Claude exports   # drop claude.ai export zips here (web/phone chats)

persona:
  default_language: match_lea      # default — Lea can change (decision 2)
  tone: warm, direct, a little playful   # default — Lea can change
  length: short_by_default         # default — Lea can change

proactivity:
  mode: only_when_topic_comes_up   # default — Lea can change (decision 10)
  max_asides_per_conversation: 1

knowledge:
  folders: []                      # Lea chooses (decision 4); nothing indexed until she does

voice:
  enabled: true
  stt_model: mlx-community/whisper-large-v3-turbo
  # Speech output: "kokoro" (Kokoro-82M on this Mac, decision T27) or "system" (macOS/iOS voices, T11).
  # The Mac app falls back to the system voice if Kokoro isn't available. The iPhone Shortcut uses Siri's voice.
  tts: kokoro
  tts_model: mlx-community/Kokoro-82M-bf16
  kokoro_voices: {en: af_heart, es: ef_dora, fr: ff_siwis}   # default — Lea can change (decision 9)
  speed: 1.0
  # How names should sound (espeak reads "Lea" as "Lee"). Default — Lea can change.
  respell: {en: {Lea: Leia}, es: {Sylvie: Silvi}, fr: {Lea: Léa}}
  voices: {en: "Samantha", es: "Mónica", fr: "Thomas"}   # system voices (fallback and iPhone)
  wake_greeting: {en: "Hello Lea", es: "Hola Lea", fr: "Bonjour Lea"}

actions:
  # Allowlist: only these can ever be called. Remove one to switch it off; [] turns all actions off.
  enabled: [music, play_music, calendar_events, create_event, create_reminder, set_timer,
            open_app, open_in_browser, run_shortcut, read_emails, draft_email, send_email]
  mail_from: ""          # empty = Mail's default account (decision 5, default — Lea can change)

phone:
  # Hostnames the phone gateway answers on, e.g. ["lea-mac.tail1234.ts.net"] once Tailscale is set up
  # (decision 8, default — Lea can change). Empty = phone access off.
  allowed_hosts: []

schedule:
  enabled: true
  window_start: "01:00"         # heavy jobs only at night…
  window_end: "07:00"
  idle_minutes: 30              # …when Lea hasn't used Sylvie for this long…
  max_hours_per_night: 5        # …plugged in (never on battery), within this cap
  finetune_every_days: 10       # plan: every 1–2 weeks, promoted only if better
  interest_research: weekly     # decision 10 — default, Lea can change (off | weekly | daily)

privacy:
  log_conversations: true
  delete_audio_after_transcription: true
