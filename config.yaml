# Sylvie configuration. Everything swappable lives here (plan section 5).
# Values marked "default — Lea can change" are decisions Lea hasn't made yet.

user:
  name: Lea
  city: Madrid
  timezone: Europe/Madrid
  currency: EUR
  languages: [en, es, fr]

paths:
  # All personal data lives outside Documents so it never syncs to iCloud (rule 15).
  data_dir: ~/Library/Application Support/Sylvie
  adapters_dir: ~/Library/Application Support/Sylvie/adapters

llm:
  # Lea chose speed (2026-11-06): the 27B (~18 GB) made the Mac swap with her other apps (9-10 tok/s,
  # 15-35 s answers). Back to the 27B any time: mlx-community/Qwen3.8-27B-4bit (still downloaded).
  model: mlx-community/Qwen3.5-9B-4bit
  adapter: null              # e.g. v001 once a fine-tune is promoted
  context_length: 16384      # set explicitly; long chats get summarized
  summarize_after_tokens: 11000
  max_tokens_fast: 1024
  max_tokens_thinking: 4096
  temperature: 0.7
  top_p: 0.8
  thinking_temperature: 0.6
  thinking_top_p: 0.95

embeddings:
  model: mlx-community/Qwen3-Embedding-0.6B-8bit   # default — Lea can change
  dim: 1024

server:
  host: 127.0.0.1           # never 0.0.0.0 (rule 2)
  port: 8765
  allowed_origins: ["http://127.0.0.1:8765"]

search:
  enabled: true
  searxng_url: http://127.0.0.1:8888
  max_results: 5
  max_pages_to_open: 3

memory:
  recall_top_k: 6
  extract_in_background: true
  # Learn from Lea's own messages to Claude: Claude Code (~/.claude/projects) and claude.ai exports, read locally.
  # Only what she typed — never Claude's answers. Rules about answers arrive switched off for her to approve.
  claude_history:
    enabled: true
    folder: ~/.claude/projects
    exclude_projects: []           # folder names under ~/.claude/projects to skip
    exports_folder: ~/Documents/Projects/Apps/Sylvie/Claude exports   # claude.ai export zips (web/phone chats); not in git

persona:
  default_language: match_lea      # default — Lea can change (decision 2)
  tone: warm, direct, a little playful   # default — Lea can change
  length: short_by_default         # default — Lea can change

quick_replies:
  # "Hello", "thanks", "bye", "how are you" (EN/ES/FR) are answered instantly, without the model.
  # Change a reply by adding e.g.:  hello: {en: ["Hey {name}!"], es: ["¡Hola {name}!"]}
  # Intents: hello, good_morning, good_afternoon, good_evening, good_night, thanks, bye, how_are_you.
  enabled: true

shortcuts:
  # Requests Lea makes often (3+ times, e.g. "what's on my calendar today?") get their lookup started
  # right away instead of after a model round. Only read-only lookups; answers are always fresh.
  # See them: GET /api/shortcuts; switch one off: POST /api/shortcuts/<id> {"status": "off"}.
  enabled: true

proactivity:
  mode: only_when_topic_comes_up   # default — Lea can change (decision 10)
  max_asides_per_conversation: 2   # Lea wants more initiative (2026-11-06)

knowledge:
  folders: []                      # Lea chooses (decision 4); nothing indexed until she does

voice:
  enabled: true
  stt_model: mlx-community/whisper-large-v3-turbo
  # Speech output: "kokoro" (Kokoro-82M on this Mac, decision T27) or "system" (macOS/iOS voices, T11).
  # The Mac app falls back to the system voice if Kokoro isn't available. The iPhone Shortcut uses Siri's voice.
  speak_full_answer: true   # Lea's rule (2026-11-06): read the whole answer aloud; she says "stop" to interrupt
  tts: kokoro
  tts_model: mlx-community/Kokoro-82M-bf16
  kokoro_voices: {en: af_heart, es: ef_dora, fr: ff_siwis}   # Lea tried Isabella, went back to Heart (2026-11-06)
  speed: 1.0
  # How names should sound (espeak reads "Lea" as "Lee"). Default — Lea can change.
  respell: {en: {Lea: Leia}, es: {Sylvie: Silvi}, fr: {Lea: Léa}}
  voices: {en: "Samantha", es: "Mónica", fr: "Thomas"}   # system voices (fallback and iPhone)
  wake_greeting: {en: "Hello Lea", es: "Hola Lea", fr: "Bonjour Lea"}

actions:
  # Allowlist: only these can ever be called. Remove one to switch it off; [] turns all actions off.
  enabled: [music, play_music, save_playlist, calendar_events, create_event, create_reminder, set_timer,
            open_app, open_in_browser, run_shortcut, run_command, read_emails, draft_email, send_email]
  # run_command: Terminal commands (Lea, 2026-11-06). sudo, disk erasing, wiping folders, Keychain
  # passwords and curl|sh never run. Remove it here to switch off.
  confirm: never   # Lea, 2026-11-06: "never ask" (delete_or_send | changes are the other options)
  mail_from: ""          # empty = Mail's default account (decision 5, default — Lea can change)

phone:
  # Hostnames the phone gateway answers on, e.g. ["lea-mac.tail1234.ts.net"] once Tailscale is set up
  # (decision 8, default — Lea can change). Empty = phone access off.
  allowed_hosts: []

schedule:
  enabled: true
  window_start: "01:00"         # heavy jobs only at night…
  window_end: "07:00"
  idle_minutes: 30              # …when Lea hasn't used Sylvie for this long…
  max_hours_per_night: 5        # …plugged in (never on battery), within this cap
  finetune_every_days: 3        # was 10; with permanent training there's enough new data sooner
  always: true                  # Lea, 2026-11-07: train whenever Sylvie is unused (any hour), stop when she's used
  always_idle_minutes: 5        # …after this many quiet minutes (plugged in only; never on battery)
  always_job_minutes: 240       # one practice run, then the next starts while she's still unused
  interest_research: daily
learning:
  # Lea chose autonomy (2026-11-07): night pairs on GENERAL questions that code verified, or that the
  # local judge re-graded at least this high, train without her spot-check. Personal ones still wait.
  auto_approve_judged: true
  auto_approve_min_score: 8
  cycle_minutes: 90             # time kept free at the end of a run for train + evals (9B: ~20 min train)      # Lea wants Sylvie to learn more on her own (2026-11-06); off | weekly | daily

privacy:
  log_conversations: true
  delete_audio_after_transcription: true
