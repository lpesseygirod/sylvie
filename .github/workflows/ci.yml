name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed   # the runner's own Python can't load SQLite extensions (sqlite-vec)
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
        env:
          HF_HUB_OFFLINE: "1"
