name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
        env:
          HF_HUB_OFFLINE: "1"
