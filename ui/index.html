<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sylvie</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%237c5cff'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Georgia'>S</text></svg>">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top">
        <button id="new-chat" class="btn-primary" title="New chat (⌘K)">＋ New chat</button>
        <input id="search" type="search" placeholder="Search chats" autocomplete="off">
      </div>
      <nav id="conv-list" aria-label="Conversations"></nav>
      <div class="side-bottom">
        <button id="open-memory" class="btn-ghost">🧠 What Sylvie knows</button>
        <button id="theme-toggle" class="btn-ghost" title="Light / dark">◐</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="toggle-sidebar" class="btn-icon" title="Toggle sidebar">☰</button>
        <h1 id="conv-title">Sylvie</h1>
        <span id="status-dot" class="dot" title="Starting…"></span>
      </header>

      <section id="messages" aria-live="polite">
        <div id="empty" class="empty">
          <div class="logo">S</div>
          <h2>Hello Lea</h2>
          <p>Ask me anything — in English, español or français.</p>
        </div>
      </section>

      <footer id="composer-wrap">
        <div id="drop-hint">Drop files to add them</div>
        <div id="attachments"></div>
        <form id="composer">
          <button type="button" id="attach" class="btn-icon" title="Add a file">📎</button>
          <input type="file" id="file-input" multiple hidden>
          <textarea id="input" rows="1" placeholder="Message Sylvie…" autofocus></textarea>
          <select id="mode" title="Answer mode">
            <option value="auto">Auto</option>
            <option value="fast">Fast</option>
            <option value="think">Think</option>
          </select>
          <button type="submit" id="send" class="btn-send" title="Send (Enter)">↑</button>
        </form>
        <p class="fine">Sylvie runs on your Mac. Nothing leaves it except web searches.</p>
      </footer>
    </main>
  </div>

  <dialog id="memory-dialog">
    <form method="dialog" class="dialog-head">
      <h2>What Sylvie knows about you</h2>
      <button class="btn-icon" value="close">✕</button>
    </form>
    <div class="tabs">
      <button data-tab="preferences" class="active">Preferences</button>
      <button data-tab="facts">Facts</button>
      <button data-tab="interests">Interests</button>
      <button data-tab="traits">Style</button>
    </div>
    <div id="memory-body"></div>
  </dialog>

  <script src="/static/markdown.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
