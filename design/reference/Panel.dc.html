<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sylvie — Wake panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A1C22}
a{color:#8EA8FF;text-decoration:none}a:hover{color:#B7C6FF}
.sv-mini{position:relative;width:44px;height:44px;flex:none}
.sv-mini .sv-blob{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;filter:blur(5px);animation:sv-spin 6s linear infinite}
.sv-mini .sv-b1{background:radial-gradient(circle at 30% 30%,#C59BFF 0%,rgba(197,155,255,0) 65%)}
.sv-mini .sv-b2{background:radial-gradient(circle at 72% 45%,#5B7CFF 0%,rgba(91,124,255,0) 62%);animation-direction:reverse;animation-duration:8s}
.sv-mini .sv-core{position:absolute;inset:24%;border-radius:50%;background:radial-gradient(circle at 42% 38%,#FFFFFF 0%,#E6DEFF 30%,rgba(169,139,255,0) 75%);filter:blur(1.5px);animation:sv-breathe 2.2s ease-in-out infinite}
@keyframes sv-spin{to{transform:rotate(360deg)}}
@keyframes sv-breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.sv-mini .sv-blob,.sv-mini .sv-core{animation:none}}
</style>
</helmet>
<div style="width: 760px; height: 480px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #1A1C22; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #ECEEF3">
  <section aria-label="Sylvie" style="width: 620px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 16px; border-radius: 22px; background: rgba(18, 19, 24, 0.94); border: 1px solid #2E323D; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45)">

    <div style="display: flex; align-items: center; gap: 14px">
      <div class="sv-mini" aria-hidden="true">
        <div class="sv-blob sv-b1"></div>
        <div class="sv-blob sv-b2"></div>
        <div class="sv-core"></div>
      </div>
      <p style="margin: 0; flex: 1; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.35">“Sylvie, tell Marta I’m running ten minutes late.”</p>
    </div>

    <p style="margin: 0; padding-left: 58px; color: #C9CDD6; line-height: 1.55">Here’s the message. Want me to send it?</p>

    <div style="margin-left: 58px; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #1A1D25; border: 1px solid #2A2E38">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AA1B0">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
        Messages · to Marta
      </div>
      <p style="margin: 0; font-size: 15px; color: #ECEEF3">Running 10 min late, sorry! See you soon.</p>
      <div style="display: flex; gap: 8px">
        <button type="button" style="min-height: 40px; padding: 0 18px; border-radius: 10px; border: 0; background: #8EA8FF; color: #0E0F13; font: inherit; font-weight: 600; cursor: pointer">Send</button>
        <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #2A2E38; background: transparent; color: #ECEEF3; font: inherit; cursor: pointer">Edit</button>
        <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: transparent; color: #9AA1B0; font: inherit; cursor: pointer">Cancel</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding-top: 4px; border-top: 1px solid #23262F">
      <span style="font-size: 12px; color: #9AA1B0">Say “yes” to send · nothing is sent without your OK</span>
      <a href="Main.dc.html" style="margin-left: auto; display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500">
        Open chat
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
