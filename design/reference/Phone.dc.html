<style>
body{margin:0;background:#08090C}
a{color:#8EA8FF;text-decoration:none}a:hover{color:#B7C6FF}
.sv-orb{position:relative;width:200px;height:200px}
.sv-glow{position:absolute;inset:-50px;border-radius:50%;background:radial-gradient(circle,rgba(142,168,255,.26) 0%,rgba(197,155,255,.08) 42%,rgba(8,9,12,0) 70%);animation:sv-pulse 3s ease-in-out infinite}
.sv-blob{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;filter:blur(12px);animation:sv-spin 12s linear infinite}
.sv-b1{background:radial-gradient(circle at 32% 30%,#C59BFF 0%,rgba(197,155,255,0) 62%)}
.sv-b2{background:radial-gradient(circle at 72% 42%,#5B7CFF 0%,rgba(91,124,255,0) 60%);animation-duration:16s;animation-direction:reverse}
.sv-b3{background:radial-gradient(circle at 48% 76%,#6FE0FF 0%,rgba(111,224,255,0) 56%);animation-duration:20s}
.sv-core{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 42% 38%,#FFFFFF 0%,#E6DEFF 22%,rgba(169,139,255,.55) 55%,rgba(91,124,255,0) 75%);filter:blur(3px);animation:sv-breathe 3s ease-in-out infinite}
@keyframes sv-spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.06)}100%{transform:rotate(360deg) scale(1)}}
@keyframes sv-breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.06)}}
@keyframes sv-pulse{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.sv-glow,.sv-blob,.sv-core{animation:none}}
